<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Fighter">
<meta name="theme-color" content="#070519">
<title>Family Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-bleed landscape arena canvas; HTML overlays for menu, pause, end; two touch pads split the bottom of the screen 50/50. Single night-sky look on purpose. */
:root{
  --sky:#140e36; --ink:#0c0824; --panel:#1d1546; --line:#3b2f7a;
  --gold:#ffd25a; --text:#fff7e8; --muted:#b8acd9;
  --knight:#5fd4ff; --fairy:#ff7cc0;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Cinzel","Noto Serif TC",serif;
  --f-epic:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --p1:#4fc3ff; --p2:#ff5470;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--f-display)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- touch pads: metal-rimmed gem buttons with glass sheen ---------- */
.pad{position:fixed;bottom:0;width:50%;height:186px;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#pad0{left:0;padding-left:env(safe-area-inset-left,0px)}
#pad1{right:0;padding-right:env(safe-area-inset-right,0px)}
.pad .who{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.1em;color:var(--c);opacity:.9;text-shadow:0 2px 6px #000;white-space:nowrap}
.stick{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:220px;height:220px;pointer-events:auto;touch-action:none}
#pad1 .stick{left:auto;right:max(8px,env(safe-area-inset-right,0px))}
.base{position:absolute;left:50%;top:50%;width:156px;height:156px;margin:-78px 0 0 -78px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 38%,transparent 39%),
    repeating-conic-gradient(from -3deg,rgba(255,255,255,.28) 0 6deg,transparent 6deg 45deg),
    radial-gradient(circle,rgba(30,20,70,.35),rgba(8,5,26,.72) 72%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -10px 24px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.08),
    0 0 0 4px rgba(12,8,36,.85),0 0 0 6px color-mix(in srgb,var(--c) 55%,#8a8fb0),0 0 0 8px rgba(12,8,36,.7),0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
.base::before{content:"";position:absolute;inset:16px;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}
.base .ar{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.55}
.base .ar.u{left:50%;top:6px;margin-left:-8px;border-bottom:11px solid var(--c);border-top:0;filter:drop-shadow(0 0 4px var(--c))}
.base .ar.l{left:6px;top:50%;margin-top:-8px;border-right:11px solid #cfd3ea;border-left:0}
.base .ar.r{right:6px;top:50%;margin-top:-8px;border-left:11px solid #cfd3ea;border-right:0}
.base .jl{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.55)}
.knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 38% 30%,#fff 0,color-mix(in srgb,var(--c) 45%,#fff) 14%,var(--c) 42%,color-mix(in srgb,var(--c) 45%,#0b0620) 88%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.4),inset 0 3px 3px rgba(255,255,255,.6),0 0 0 3px #e9ebf7,0 0 0 5px #6d7290,0 8px 16px rgba(0,0,0,.55)}
.knob::after{content:"";position:absolute;inset:22px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);opacity:.6}
.btns{position:absolute;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:294px;height:236px}
#pad1 .btns{right:auto;left:12px}
#pad1 .b.atk{left:auto;right:128px}#pad1 .b.s1{left:auto;right:34px}#pad1 .b.s2{left:auto;right:46px}#pad1 .b.s3{left:auto;right:126px}#pad1 .b.ult{left:auto;right:208px}
#pad1 .b .n{right:auto;left:-6px}
.stick{transform:scale(var(--ps,.74));bottom:calc(2px + env(safe-area-inset-bottom,0px))}
.btns{transform:scale(var(--bs,.74));bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#pad0 .stick,#pad0 .btns{transform-origin:0 100%}
#pad1 .stick,#pad1 .btns{transform-origin:100% 100%}
#pad0 .btns{right:auto;left:calc(max(8px,env(safe-area-inset-left,0px)) + 214px*var(--ps,.74) + 14px)}
#pad1 .btns{left:auto;right:calc(max(8px,env(safe-area-inset-right,0px)) + 214px*var(--ps,.74) + 14px)}
/* wide, low row of oval buttons: attack next to the stick, then skills 1-3, ult toward the middle */
.pad .btns{width:556px;height:112px}
.pad .btns .b{top:auto}
.pad .b.atk{width:128px;height:102px;bottom:0}
.pad .b.s1,.pad .b.s2,.pad .b.s3{width:96px;height:74px}
.pad .b.s1,.pad .b.s3{bottom:8px}.pad .b.s2{bottom:20px}
.pad .b.ult{width:106px;height:86px;bottom:6px}
#pad0 .b.atk{left:0;right:auto}#pad0 .b.s1{left:140px;right:auto}#pad0 .b.s2{left:246px;right:auto}#pad0 .b.s3{left:352px;right:auto}#pad0 .b.ult{left:450px;right:auto}
#pad1 .b.atk{right:0;left:auto}#pad1 .b.s1{right:140px;left:auto}#pad1 .b.s2{right:246px;left:auto}#pad1 .b.s3{right:352px;left:auto}#pad1 .b.ult{right:450px;left:auto}
.pad .b svg{width:50%;height:62%}
.b{--ring:conic-gradient(from 210deg,#f6f7ff,#8d92ad,#fdfdff,#585d78,#e6e8f5,#8d92ad,#f6f7ff);
  position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;isolation:isolate;padding:0;box-sizing:border-box;border:6px solid transparent;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 35%,#fff) 0,var(--c) 42%,color-mix(in srgb,var(--c) 50%,#0b0620) 100%) padding-box,var(--ring) border-box;
  box-shadow:inset 0 -8px 14px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.7),0 0 0 1px rgba(0,0,0,.6),0 0 16px color-mix(in srgb,var(--c) 40%,transparent),0 10px 16px rgba(0,0,0,.5);transition:transform .06s}
.b .gl{position:absolute;left:16%;right:16%;top:7%;height:40%;border-radius:50% 50% 45% 45%;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.08))}
.b svg{position:relative;z-index:2;width:58%;height:58%;overflow:visible;filter:drop-shadow(0 0 1.5px rgba(10,6,30,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.b::after{content:"";position:absolute;inset:-1px;border-radius:50%;z-index:4;pointer-events:none;
  background:conic-gradient(rgba(8,5,26,.7) calc(var(--cd,0)*360deg),transparent 0)}
.b .cdn{position:absolute;z-index:5;font:22px var(--f-num);color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
.b.on{transform:translateY(3px) scale(.93)}
.b.atk{width:108px;height:108px;left:128px;top:112px}
.b.s1{width:74px;height:74px;left:34px;top:150px}
.b.s2{width:74px;height:74px;left:46px;top:52px}
.b.s3{width:74px;height:74px;left:126px;top:14px}
.b.ult{width:86px;height:86px;left:208px;top:4px;--c:#ffc83a}
.b.ult{--ring:conic-gradient(from 200deg,#fff6d0,#b98a2a,#fff3c0,#7a5a18,#ffe9a0,#b98a2a,#fff6d0)}
.b.ult::after{background:conic-gradient(transparent calc(var(--m,0)*360deg),rgba(8,5,26,.7) 0)}
.b.ult .rays{position:absolute;inset:-26px;border-radius:50%;z-index:-2;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,220,110,.85) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 63%,transparent 71%);mask:radial-gradient(circle,transparent 58%,#000 63%,transparent 71%)}
.b.ult.ready{animation:pulse .7s ease-in-out infinite alternate}
.b.ult.ready .rays{opacity:1;animation:spin 3s linear infinite}
.b .n{position:absolute;top:-6px;right:-6px;z-index:6;width:22px;height:22px;border-radius:50%;background:#0c0824;border:2px solid #cfd3ea;font:13px/18px var(--f-num);color:#fff;font-style:normal;text-align:center}
@keyframes pulse{to{transform:scale(1.08)}}

/* ---------- top buttons ---------- */
#pauseBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(50% + 62px);width:44px;height:44px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line);font:18px var(--f-num);color:var(--muted)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,rgba(40,24,100,.55),rgba(8,5,26,.88));overflow:auto;touch-action:pan-y}

/* ---------- title screen ---------- */
.scr{padding:0;display:block;overflow:hidden;touch-action:none}
#title{background:#05030f;cursor:pointer}
#title .tbg{position:absolute;left:-6%;top:-6%;width:112%;height:112%;object-fit:cover;filter:blur(20px) brightness(.55) saturate(1.2)}
#title video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#title .tap{position:absolute;left:50%;bottom:calc(1.6vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;border:0;background:linear-gradient(90deg,transparent,rgba(6,3,20,.7) 20%,rgba(6,3,20,.7) 80%,transparent);
  padding:.35em 2.4em;font:900 clamp(16px,2vw,22px) var(--f-epic);letter-spacing:.45em;color:#fff;text-shadow:0 0 12px rgba(120,200,255,.9);animation:blink 1.4s ease-in-out infinite;white-space:nowrap}
#title .rays{position:absolute;left:50%;top:30%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(rgba(255,210,90,.10) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 32%);mask:radial-gradient(circle,#000 0,transparent 32%);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#title .cast{position:absolute;left:0;right:0;bottom:0;height:64%;display:flex;justify-content:center;align-items:flex-end}
#title .cast img{height:var(--h,92%);width:auto;max-width:15.5vw;object-fit:contain;margin:0 -1.6vw;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 70%,transparent)) drop-shadow(0 10px 16px rgba(0,0,0,.6));
  animation:castIn .9s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--d,0s);transform-origin:50% 100%}
@keyframes castIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
#title .cast::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(6,3,20,.95))}
#title .logo{position:absolute;top:calc(5vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:2;animation:logoIn 1s .2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logoIn{from{opacity:0;transform:scale(1.6)}}
.logo .eyebrow{display:block;font:clamp(14px,1.7vw,20px) var(--f-num);letter-spacing:.6em;padding-left:.6em;color:#ffe9a8;opacity:.85}
.logo h1{margin:.06em 0 0;font:900 clamp(64px,11.5vw,150px)/1 var(--f-epic);letter-spacing:.06em;padding-left:.06em;
  background:linear-gradient(180deg,#fffdf0 0%,#ffe27a 38%,#e39a1c 62%,#fff1b0 64%,#c9780e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #5a2c06;filter:drop-shadow(0 5px 0 #3a1a04) drop-shadow(0 0 30px rgba(255,190,70,.45))}
.logo .sub{margin:.5em 0 0;font-size:clamp(15px,1.8vw,20px);letter-spacing:.4em;padding-left:.4em;color:var(--muted)}
.logo .sub b{color:var(--p1);font-weight:400}.logo .sub i{color:var(--p2);font-style:normal}
#title .press{position:absolute;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;
  font-size:clamp(22px,2.6vw,32px);letter-spacing:.35em;padding:.5em 1.4em .5em 1.75em;color:#fff;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(12,8,36,.85) 18%,rgba(12,8,36,.85) 82%,transparent);text-shadow:0 0 14px rgba(255,210,90,.8);animation:blink 1.2s ease-in-out infinite}
#title .press::before,#title .press::after{content:"◆";font-size:.55em;color:var(--gold);margin:0 .9em;vertical-align:.2em}
@keyframes blink{50%{opacity:.35}}
#title .ver{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font:13px var(--f-num);letter-spacing:.12em;color:rgba(184,172,217,.6);z-index:3}

/* ---------- character select ---------- */
#select{background:linear-gradient(180deg,rgba(6,3,20,.55),rgba(6,3,20,.82))}
.selhead{position:absolute;top:0;left:0;right:0;height:68px;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;z-index:5;
  background:linear-gradient(180deg,rgba(6,3,20,.9),transparent)}
.selhead h2{margin:0;font:900 clamp(24px,2.8vw,34px) var(--f-epic);letter-spacing:.4em;padding-left:.4em;color:#ffe9a8;text-shadow:0 3px 0 #3a1a04}
.selhead .back{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:rgba(12,8,36,.7);font-size:16px;color:var(--muted)}
.selhead .rule{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(22px + env(safe-area-inset-top,0px));font-size:14px;letter-spacing:.15em;color:var(--muted)}
.sides{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.side{--c:#fff;--pc:var(--p1);position:relative;overflow:hidden;min-width:0}
.side.p2{--pc:var(--p2)}
.side .slab{position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 34%,transparent),transparent 62%);
  clip-path:polygon(0 0,100% 0,82% 100%,0 100%);transition:background .3s}
.side.p2 .slab{clip-path:polygon(0 0,100% 0,100% 100%,18% 100%);background:linear-gradient(200deg,color-mix(in srgb,var(--c) 34%,transparent),transparent 62%)}
.side .slab::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.side .art{position:absolute;bottom:0;left:0;height:80%;width:44%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.side.p2 .art{left:auto;right:0}
.side .art::before{content:"";position:absolute;left:50%;bottom:4%;width:120%;aspect-ratio:1;max-width:100%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 65%)}
.side .art img{position:relative;height:100%;width:auto;max-width:125%;object-fit:contain;transform:scaleX(var(--fx,1));
  filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 60%,transparent)) drop-shadow(0 12px 18px rgba(0,0,0,.6));animation:artIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes artIn{from{opacity:0;translate:var(--from,-40px) 0}}
.side.p2 .art img{--from:40px}
.side .info{position:absolute;top:80px;right:3%;width:52%;display:flex;flex-direction:column;gap:6px;min-width:0;z-index:2;padding:14px 16px 16px;border-radius:16px;
  background:linear-gradient(160deg,rgba(12,8,36,.82),rgba(12,8,36,.62));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.side.p2 .info{right:auto;left:3%}
.pbadge{align-self:flex-start;font:28px/1 var(--f-num);color:#0c0824;background:var(--pc);padding:6px 14px 4px;border-radius:8px;transform:skewX(-10deg);box-shadow:0 0 18px color-mix(in srgb,var(--pc) 60%,transparent)}
.side .name{margin:4px 0 0;font:900 clamp(30px,4.2vw,54px)/1.05 var(--f-epic);color:#fff;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000),0 0 22px color-mix(in srgb,var(--c) 50%,transparent);text-wrap:balance}
.side .tag{font-size:16px;color:var(--c);letter-spacing:.08em}
.side ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.side li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.35;color:var(--text);min-width:0}
.side li b{display:grid;place-items:center;height:24px;border-radius:6px;background:color-mix(in srgb,var(--c) 30%,#140e36);color:#fff;font:14px var(--f-num)}
.side li.u b{background:var(--gold);color:#3a1d00}
.side li span{min-width:0}.side li em{font-style:normal;color:#fff;font-weight:700}
.side .helper{align-self:flex-start;margin-top:6px;padding:7px 14px;border-radius:999px;border:2px solid var(--line);font-size:14px;color:var(--muted);background:rgba(12,8,36,.6)}
.side .helper[aria-pressed="true"]{border-color:var(--gold);color:#3a1d00;background:var(--gold)}
.side .tiles{position:absolute;right:3%;bottom:calc(98px + env(safe-area-inset-bottom,0px));display:flex;gap:7px}
.side.p2 .tiles{right:auto;left:3%}
.tile{--tc:#fff;position:relative;width:clamp(50px,5.5vw,72px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid color-mix(in srgb,var(--tc) 50%,#2a2060);
  background:#140e36;padding:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:1.5;color:#fff;background:linear-gradient(transparent,rgba(6,3,20,.9));text-align:center;white-space:nowrap;overflow:hidden}
.tile.on{border-color:var(--pc);transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 2px #0c0824,0 0 22px color-mix(in srgb,var(--pc) 80%,transparent)}
.tile.on::after{content:attr(data-p);position:absolute;top:2px;left:3px;font:13px/1 var(--f-num);color:#0c0824;background:var(--pc);padding:2px 5px 1px;border-radius:4px}
.side .ready{position:absolute;right:3%;bottom:calc(26px + env(safe-area-inset-bottom,0px));min-width:min(300px,40%);padding:14px 22px;border-radius:14px;font-size:24px;letter-spacing:.25em;color:#0c0824;
  background:linear-gradient(180deg,#fff,var(--pc));box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 45%,#000),0 0 24px color-mix(in srgb,var(--pc) 50%,transparent)}
.side.p2 .ready{right:auto;left:3%}
.side .ready:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--pc) 45%,#000)}
.side.isReady .ready{background:#2a2058;color:var(--muted);box-shadow:none}
.side.isReady .tiles,.side.isReady .helper{opacity:.45;pointer-events:none}
.side .stamp{position:absolute;left:30%;top:66%;z-index:3;transform:translate(-50%,-50%) rotate(-12deg) scale(0);font:900 clamp(40px,5.5vw,72px) var(--f-epic);color:var(--pc);
  border:6px solid var(--pc);padding:4px 22px;border-radius:12px;background:rgba(6,3,20,.6);text-shadow:0 0 18px color-mix(in srgb,var(--pc) 70%,transparent);opacity:0;transition:transform .25s cubic-bezier(.2,1.8,.4,1),opacity .15s;pointer-events:none;white-space:nowrap}
.side.p2 .stamp{left:70%;transform:translate(-50%,-50%) rotate(12deg) scale(0)}
.side.isReady .stamp{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.side.p2.isReady .stamp{transform:translate(-50%,-50%) rotate(12deg) scale(1)}

function resolveClashes(){const P=G.proj;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(a.o===b.o||!a.pow||!b.pow||a.dead||b.dead)continue;

    const x=(a.x+b.x)/2,y=(a.y+b.y)/2;
    if(a.pow===b.pow){a.dead=b.dead=true;clash(x,y,a.pow>=3);}
    else{const [w,l]=a.pow>b.pow?[a,b]:[b,a];l.dead=true;w.pow-=Math.ceil(l.pow/2);w.dmg=Math.max(1,w.dmg*.85);if(w.pow<=0)w.dead=true;clash(x,y,w.pow>=3);}}

  for(const st of G.storms)for(const q of P){if(q.o!==st.o&&!q.dead&&Math.abs(q.x-st.x)<150&&q.y>GY-380){q.dead=true;clash(q.x,q.y,q.pow>=3);}}

  G.proj=P.filter(q=>!q.dead);}

function boot(data){
  if(data&&Array.isArray(data.picks)&&data.picks.every(k=>CHARS[k])){G.picks=data.picks.slice();G.helper=(data.helper||G.helper).slice();}
  addEventListener('resize',resize);resize();showUI('title');
  Promise.all(ROSTER.map(k=>IMGS[k].decode?IMGS[k].decode().catch(()=>{}):0)).then(()=>{makePortraits();if(G.mode==='select')renderSelect();});
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>drawBG());
  var BOOT=(window.__duelBoot||0)+1;window.__duelBoot=BOOT;
  (function(id){function loop(t){if(id!==window.__duelBoot)return;frame(t);requestAnimationFrame(loop);}requestAnimationFrame(loop);})(BOOT);}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({picks:G.picks,helper:G.helper}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
